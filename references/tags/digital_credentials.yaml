openapi: 3.1.0
info:
  title: Brivo API
  version: 1.0.0
  description: >-
    Brivo API – Digital_Credentials endpoints. See api-overview.md for base URLs, authentication, schema conventions,
    paging, and error codes.
servers:
  - url: https://api.brivo.com/v1/api
security:
  - oauth2: []
    apiKey: []
externalDocs:
  description: API conventions and authentication
  url: https://apidocs.brivo.com/access/api-overview.md
tags:
  - name: Digital_Credentials
paths:
  /credentials/digital/allegion-allotment:
    get:
      operationId: ReturnDigitalCredAllotmentForAllegion
      summary: Digital Credential Allotment for Allegion
      description: Returns a count of the assigned digital credentials as well as the maximum number allowed for the account.
      tags:
        - Digital_Credentials
      responses:
        '200':
          description: 'Success-Response:'
          content:
            application/json:
              examples:
                'Success-Response:':
                  value:
                    allotted: 500
                    assigned: 388
  /credentials/digital/allotment:
    get:
      operationId: ReturnDigitalCredAllotment
      summary: Digital Credential Allotment
      description: Returns a count of the assigned digital credentials as well as the maximum number allowed for the account.
      tags:
        - Digital_Credentials
      responses:
        '200':
          description: 'Success-Response:'
          content:
            application/json:
              examples:
                'Success-Response:':
                  value:
                    allotted: 500
                    assigned: 388
  /users/credentials/digital:
    get:
      operationId: GetUserDigitalCredential
      summary: Digital Credential Retrieval
      description: >-
        This endpoint returns the digital credential for the current user. It does not require a userId because in many
        cases the current user is not required to know their own userId. An example of this would be a Brivo Mobile Pass
        user.
      tags:
        - Digital_Credentials
      responses:
        '200':
          description: 'Success-Response:'
          content:
            application/json:
              examples:
                'Success-Response:':
                  value:
                    id: 8675309
                    credentialValue: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDc2NTA5
                    effectiveFrom: '2016-02-02T05:00:00Z'
                    effectiveTo: '2020-12-31T05:00:00Z'
        '403':
          description: Forbidden, the attempted action is forbidden
          content:
            application/json:
              examples:
                '403 Error-Response:':
                  value:
                    code: 403
                    message: Invalid user
        '404':
          description: Not Found, the digital credential was not found
          content:
            application/json:
              examples:
                '404 Error-Response:':
                  value:
                    code: 404
                    message: Digital credential not found
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: api-key
      description: Mashery API key obtained from developer.brivo.com
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.brivo.com/oauth/authorize
          tokenUrl: https://auth.brivo.com/oauth/token
          scopes: {}
        password:
          tokenUrl: https://auth.brivo.com/oauth/token
          scopes: {}
