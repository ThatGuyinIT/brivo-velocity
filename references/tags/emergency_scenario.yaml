        '404':
          description: Not Found, the specified emergency scenario of that type was not found
          content:
            application/json:
              examples:
                '404 Error-Response:':
                  value:
                    code: 404
                    message: Scenario {scenarioId} of type {scenarioType} not found
  /emergency-scenarios/lockdown/{scenarioId}/initiate:
    post:
      operationId: initiateEmergencyLockdownScenario
      summary: Initiate Emergency Lockdown scenario
