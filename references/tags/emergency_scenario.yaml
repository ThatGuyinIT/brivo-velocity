      operationId: clearEmergencyLockdownScenario
      summary: Clear Emergency Lockdown scenario
      description: >-
        Clear an emergency lockdown scenario. Set all devices configured on a scenario from lockdown back to their
        normally operating state.
      tags:
        - Emergency_Scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          description: associated with the scenario which we want to clear
          schema:
            type: number
      responses:
        '200':
