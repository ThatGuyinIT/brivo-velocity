          in: path
          required: true
          description: ''
          schema:
            type: string
      responses:
        '204':
          description: Successful Response
        '403':
          description: Forbidden, the attempted action is forbidden
          content:
            application/json:
              examples:
                '403 Error-Response:':
                  value:
                    code: 403
                    message: You are not allowed to perform that action
        '404':
          description: Not Found, the specified event subscription was not found
          content:
            application/json:
              examples:
                '404 Error-Response:':
