                    encryptedSecretWord: rL6NGWa1TkxGsyl3M3Fp9w==
        '403':
          description: Forbidden, the attempted action is forbidden
          content:
            application/json:
              examples:
                '403 Error-Response:':
                  value:
                    code: 403
                    message: You are not allowed to perform that action
        '404':
          description: Not Found, the specified event subscription was not found
          content:
            application/json:
              examples:
                '404 Error-Response:':
                  value:
                    code: 404
                    message: Event subscription not found
    put:
      operationId: UpdateEventSubscription
      summary: Update Event Subscription
      description: Update event subscription.
      tags:
        - Event_Subscription
      parameters:
        - name: eventSubscriptionId
          in: path
          required: true
          description: ''
          schema:
            type: string
      responses:
        '200':
          description: 'Webhook Success-Response:'
          content:
            application/json:
              examples:
                'Webhook Success-Response:':
                  value:
                    id: 2452345
                    name: Site 1
                    url: http://requestb.in/13755vw1
                    errorEmail: john.doe@acme.com
                    criteria:
                      - id: 349
                        criteriaType: SITE
                        criteriaOperationType: EQ
                        criteriaValue: 12345
                    encryptedSecretWord: rL6NGWa1TkxGsyl3M3Fp9w==
        '400':
          description: Bad Request, Invalid Site criteria
          content:
            application/json:
              examples:
                '400 Error-Response:':
                  value:
                    code: 400
                    message: Invalid criteria provided
        '403':
          description: Forbidden, the attempted action is forbidden
          content:
            application/json:
              examples:
                '403 Error-Response:':
                  value:
                    code: 403
                    message: You are not allowed to perform that action
    delete:
