  /users/{id}/groups:
    post:
      operationId: UpdateUsersGroups
      summary: Update user's group memberships
      description: >-
        Simultaneously add or remove user's group memberships, or do both at once. Groups to be added will be skipped if
        the user is already a member, and groups to be removed will be skipped if the user is not a member. A user can
        be a member of at most 16 groups. If the user's total number of groups would exceed 16 after all removals and
        additions are made, it is considered an error and no action will be taken. Note that this could also include
        groups which the administrator does not have permission to view. Returns the updated list of user's group
        memberships.
      tags:
        - User
      parameters:
        - name: userId
          in: query
          required: true
          description: The id associated with the user
          schema:
            type: number
        - name: id
          in: path
          required: true
          description: ''
          schema:
            type: string
      responses:
