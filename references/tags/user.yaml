openapi: 3.1.0
info:
  title: Brivo API
  version: 1.0.0
  description: >-
    Brivo API – User endpoints. See api-overview.md for base URLs, authentication, schema conventions, paging, and error
    codes.
servers:
  - url: https://api.brivo.com/v1/api
security:
  - oauth2: []
    apiKey: []
externalDocs:
  description: API conventions and authentication
  url: https://apidocs.brivo.com/access/api-overview.md
tags:
  - name: User
paths:
  /batch/{jobId}:
    get:
      operationId: GetBatchJobStatus
      summary: Get Batch Job Status
      description: >-
        Progress and per-user failures for a job queued by `POST /users/batch`. A job id that has not been picked up yet
        - or one that never existed - reports `PENDING`. `errorProcessed` is always the full number of failures, but
        `errors` lists at most 1000 of them; when it holds fewer than `errorProcessed`, `errorsTruncated` is `true` and
        the remaining failures are not retrievable through this endpoint.
      tags:
        - User
      parameters:
        - name: jobId
          in: path
          required: true
          description: ''
          schema:
            type: string
      responses:
        default:
          description: Default response
  /users:
    get:
      operationId: ListUsers
      summary: List Users
      description: Retrieve a listing of Users
      tags:
        - User
      parameters:
        - name: offset
          in: query
          required: false
          description: Listed results will display beginning from the offset value.
          schema:
            type: number
        - name: pageSize
          in: query
          required: false
          description: The maximum number of records that will be returned for the call starting from the offset value.
          schema:
            type: number
        - name: filter
          in: query
          required: false
          description: >-
            Filters follow the common filter format for the api. Available filter criteria are   id  Filters based on
            the user id. Multiple values can be comma separated Allowed operators  eq: includes any user from the user
            ids provided ne: excludes any user from the user ids provided      firstname  Filters based on a user's
            first name Allowed operators  eq: includes any user with a first name that contains the provided firstname
            value      lastname  Filters based on a user's last name Allowed operators  eq: includes any user with a
            last name that contains the provided lastname value      user_status  Filters based on a user's status
            Allowed operators  eq: includes any user that falls under the corresponding status   Allowed user_status
            values  active: returns users who have at least one active credential with an effective date range that
            would include the current date, and be assigned to at least one group. unaffiliated: returns the listing of
            users who are not assigned to a group. suspended: returns the listing of suspended users deleted
            (deprecated): it is not supported anymore so it returns an empty result      cf_{customFieldId}  Filters
            based on a specified custom field id  For example, a custom field with an id=1234 a filter would look like
            cf_1234__eq:searchValue   Allowed operators  eq: Custom field types are taken into account during
            filtering.  DATE values must be provided in the custom_field date pattern of the definition NUMBER values
            will be matched on any exact field value TEXT values will return any field value that contains the requested
            filter value   exact: Custom field types are taken into account during filtering.  DATE values must be
            provided in the custom_field date pattern of the definition NUMBER values will be matched on any exact field
            value TEXT values will return any field value that exactly matches the requested filter value
          schema:
            type: string
            x-apidoc-original-type: text
      responses:
        '200':
          description: 'Success-Response:'
          content:
            application/json:
              examples:
                'Success-Response:':
                  value:
                    data:
                      - id: 8784984
                        firstName: John
                        lastName: Doe
                        created: '2023-04-11T01:35:12Z'
                        updated: '2024-11-25T07:08:24Z'
                        suspended: false
                        bleTwoFactorExempt: false
                        emails:
                          - address: test@test.com
                            type: Work
                          - address: hometest@test.com
                            type: Home
                        phoneNumbers:
                          - type: Work
                            number: '1234567890'
                          - type: Home
                            number: '9876543210'
                    offset: 0
                    pageSize: 20
                    count: 1
        '400':
          description: Bad Request, the provided request criteria are not valid
          content:
            application/json:
              examples:
                '400 Error-Response:':
                  value:
                    code: 400
                    message: Invalid criteria provided
