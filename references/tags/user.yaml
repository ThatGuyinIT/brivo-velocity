  /users/batch:
    post:
      operationId: BatchAssignUsersToGroup
      summary: Batch Assign Users to Group
      description: >-
        Queues a group membership change for up to 10000 users and returns a job id immediately. The work is applied
        asynchronously, one user at a time, so a user that cannot be assigned costs only that user. Poll `GET
        /batch/:jobId` for progress and per-user failures.


        Only `ADD` is supported today; `REMOVE` and `REPLACE` are rejected with a 400.
      tags:
        - User
      responses:
        '400':
          description: Bad Request, the provided request criteria are not valid
          content:
            application/json:
              examples:
                '400 Error-Response:':
                  value:
                    code: 400
                    message: Invalid criteria provided
        '404':
          description: Not Found, the specified group was not found
          content:
            application/json:
              examples:
                '404 Error-Response:':
                  value:
                    code: 404
                    message: Group not found
