name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run build
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: brivo-velocity-${{ matrix.os }}
          path: |
            dist/brivo-velocity.exe
            dist/brivo-velocity
          if-no-files-found: ignore
