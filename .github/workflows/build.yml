name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run build
      - run: npm run package

      - name: Rename binary for release (brivo-velocity-<version>-<platform>-<arch>)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ runner.os }}" = "Windows" ]; then
            name="brivo-velocity-${version}-windows-${arch}.exe"
            cp dist/brivo-velocity.exe "dist/${name}"
          else
            name="brivo-velocity-${version}-macos-${arch}"
            cp dist/brivo-velocity "dist/${name}"
          fi
          echo "ASSET_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}
